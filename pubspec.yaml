name: hindvi_app
description: "Hindvi Swarajya Mandal Management App"
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Offline Database
  sqflite: ^2.4.2
  path: ^1.9.1
  file_picker: ^10.3.7
  share_plus: ^12.0.1

  # PDF Generation
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  cryptography: 2.9.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSerifDevanagari-Regular.ttf
    - assets/images/hindvi_logo.png

  fonts:
    - family: HindviDevanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/hindvi_logo.png